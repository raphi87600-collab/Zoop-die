name: Build Zoopedie APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip Zoopedie project
        run: unzip -q Zoopedie_GitHub_APK_Builder.zip
      - name: Add Coil
        run: |
          GRADLE_FILE=$(find Zoopedie/app -maxdepth 1 \( -name "build.gradle.kts" -o -name "build.gradle" \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle file not found"
            exit 1
          fi

          if [[ "$GRADLE_FILE" == *.kts ]]; then
            sed -i '/dependencies {/a\    implementation("io.coil-kt:coil-compose:2.7.0")' "$GRADLE_FILE"
          else
            sed -i "/dependencies {/a\\    implementation 'io.coil-kt:coil-compose:2.7.0'" "$GRADLE_FILE"
          fi
      - name: Update MainActivity
        run: |
              MAIN_ACTIVITY=$(find Zoopedie/app/src/main -name MainActivity.kt | head -n 1)
              cp MainActivity.kt "$MAIN_ACTIVITY"

      - name: Configure AndroidX
        run: cp gradle.properties Zoopedie/gradle.properties
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle -p Zoopedie :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zoopedie-APK
          path: Zoopedie/app/build/outputs/apk/debug/app-debug.apk
